services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/src:/app/src
      - ./backend/database:/app/database
      - ./blockchain:/app/blockchain
      - backend_node_modules:/app/node_modules
      - db_data:/app/database
      - ./ssl:/app/ssl
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_PATH=/app/database/ft_transcendence.db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - BACKEND_PORT=${BACKEND_PORT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - TWO_FA_ISSUER=${TWO_FA_ISSUER}
      - SSL_CERT_PATH=/app/ssl/cert.pem
      - SSL_KEY_PATH=/app/ssl/key.pem
      - BLOCKCHAIN_RPC_URL=${BLOCKCHAIN_RPC_URL}
      - BLOCKCHAIN_PRIVATE_KEY=${BLOCKCHAIN_PRIVATE_KEY}
      - BLOCKCHAIN_WALLET_ADDRESS=${BLOCKCHAIN_WALLET_ADDRESS}
      - SNOWTRACE_API_KEY=${SNOWTRACE_API_KEY}
    depends_on:
      - db-setup
    networks:
      - ft_network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "backend"
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
      - ./ssl:/app/ssl
    environment:
      - NODE_ENV=${NODE_ENV}
      - VITE_API_URL=${VITE_API_URL}
      - VITE_WS_URL=${VITE_WS_URL}
    networks:
      - ft_network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "frontend"
    command: npm run dev

  db-setup:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: ft_db_setup
    env_file:
      - .env
    volumes:
      - db_data:/database
      - database_node_modules:/database/node_modules
    environment:
      - DATABASE_PATH=/database/ft_transcendence.db
    networks:
      - ft_network
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "db-setup"

  prometheus:
    container_name: prometheus
    image: prometheus:prometheus
    build:
      context: ./prometheus
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - alertmanager
    command:
      - /usr/bin/prometheus
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.route-prefix=/prometheus
      - --web.external-url=https://localhost:${PROMETHEUS_PORT}/prometheus
      - --web.config.file=/etc/prometheus/web-config.yml
    ports:
      - "${PROMETHEUS_PORT}:${PROMETHEUS_PORT}"
    volumes:
      - prometheus:/prometheus
      - ./ssl:/etc/prometheus/ssl
      - ./prometheus/conf/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/conf/alerts.yml.template:/etc/prometheus/alerts.yml.template
      - ./prometheus/conf/web-config.yml:/etc/prometheus/web-config.yml
    environment:
      - ALERT_TIME=${ALERT_TIME:-15}
      - CPU_PERCENTAGE=${CPU_PERCENTAGE:-80}
      - MEM_PERCENTAGE=${MEM_PERCENTAGE:-50}
    networks:
      - ft_network
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "prometheus"

  alertmanager:
    build:
      context: ./prometheus/alertmanager
      dockerfile: Dockerfile
    container_name: alertmanager
    env_file:
      - .env
    command:
      - /bin/alertmanager
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:${ALERTMANAGER_PORT}
    ports:
      - "${ALERTMANAGER_PORT}:${ALERTMANAGER_PORT}"
    volumes:
      - alertmanager-data:/alertmanager
      - ./prometheus/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template
    environment:
      - ALERTMANAGER_SLACK_WEBHOOK=${ALERTMANAGER_SLACK_WEBHOOK}
      - ALERTMANAGER_SLACK_CHANNEL=${ALERTMANAGER_SLACK_CHANNEL}
      - ALERTMANAGER_SLACK_USERNAME=${ALERTMANAGER_SLACK_USERNAME}
    networks:
      - ft_network
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "alertmanager"

  grafana:
    container_name: grafana
    image: grafana:grafana
    build:
      context: ./grafana
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/ssl/cert.pem
      GF_SERVER_CERT_KEY: /etc/grafana/ssl/key.pem
    ports:
      - "${GRAFANA_PORT}:${GRAFANA_PORT}"
    volumes:
      - grafana:/var/lib/grafana
      - ./ssl:/etc/grafana/ssl
      - ./grafana/conf/provisioning:/etc/grafana/provisioning
    networks:
      - ft_network
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "grafana"

  elasticsearch:
    build:
      context: ./elk/elasticsearch
      dockerfile: Dockerfile
    container_name: elk_elasticsearch
    env_file:
      - .env
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=/usr/share/elasticsearch/config/ssl/key.pem
      - xpack.security.http.ssl.certificate=/usr/share/elasticsearch/config/ssl/cert.pem
      - xpack.security.http.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=/usr/share/elasticsearch/config/ssl/key.pem
      - xpack.security.transport.ssl.certificate=/usr/share/elasticsearch/config/ssl/cert.pem
      - xpack.security.transport.ssl.verification_mode=none
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=ft-elastic
      - node.name=ft-elastic-node
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./ssl:/usr/share/elasticsearch/config/ssl:ro
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - ft_network
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "elasticsearch"

  logstash:
    build:
      context: ./elk/logstash
      dockerfile: Dockerfile
    container_name: elk_logstash
    env_file:
      - .env
    depends_on:
      - elasticsearch
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTICSEARCH_HOST=https://elasticsearch:9200
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
      - "12201:12201/udp"
    networks:
      - ft_network
    restart: unless-stopped

  kibana:
    build:
      context: ./elk/kibana
      dockerfile: Dockerfile
    container_name: elk_kibana
    env_file:
      - .env
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/kibana/config/ssl/cert.pem
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - SERVER_PUBLICBASEURL=https://localhost:5601
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/kibana/config/ssl/cert.pem
      - SERVER_SSL_KEY=/usr/share/kibana/config/ssl/key.pem
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    ports:
      - "5601:5601"
    volumes:
      - kibana_data:/usr/share/kibana/data
      - ./ssl:/usr/share/kibana/config/ssl
    networks:
      - ft_network
    restart: unless-stopped
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "kibana"

  kibana-setup:
    image: mirror.gcr.io/library/alpine:3.19
    container_name: elk_kibana_setup
    env_file:
      - .env
    depends_on:
      - kibana
    volumes:
      - ./elk/kibana/setup_kibana.sh:/setup_kibana.sh
    command: >
      /bin/sh -c "apk add --no-cache curl && chmod +x /setup_kibana.sh && /setup_kibana.sh"
    networks:
      - ft_network
    restart: "no"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "kibana-setup"
    environment:
      - KIBANA_USER=${ELASTIC_USER}
      - KIBANA_PASS=${ELASTIC_PASSWORD}
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - KIBANA_SYSTEM_PASSWORD=${KIBANA_SYSTEM_PASSWORD}

  node-exporter:
    image: mirror.gcr.io/prom/node-exporter:v1.7.0
    container_name: node-exporter
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=:9101'
    ports:
      - 9101:9101
    networks:
      - ft_network

networks:
  ft_network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
  database_node_modules:
  db_data:
  prometheus:
  grafana:
  alertmanager-data:
  es_data:
  kibana_data:
