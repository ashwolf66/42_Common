input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
  }
  gelf {
    port => 12201
  }
}

filter {
  if [tag] in ["backend", "frontend", "db-setup", "prometheus", "grafana", "elasticsearch", "kibana", "kibana-setup", "nginx"] {
    mutate {
      add_field => {
        "type" => "docker_log"
        "service" => "%{tag}"
      }
    }
  }

  # Parse nginx access logs if the tag is nginx (common/combined formats)
  if [tag] == "nginx" and [message] {
    grok {
      match => {
        "message" => [
          "^%{IPORHOST:clientip} - %{DATA:ident} %{DATA:auth} \[%{HTTPDATE:timestamp}\] \"%{WORD:verb} %{DATA:request}(?: HTTP/%{NUMBER:httpversion})?\" %{NUMBER:response} %{NUMBER:bytes}(?: \"%{DATA:referrer}\" \"%{DATA:agent}\")?",
          "^%{IPORHOST:clientip} - %{DATA:auth} \[%{HTTPDATE:timestamp}\] \"%{WORD:verb} %{DATA:request}(?: HTTP/%{NUMBER:httpversion})?\" %{NUMBER:response} %{NUMBER:bytes}"
        ]
      }
      overwrite => ["message"]
    }
    date {
      match => ["timestamp", "dd/MMM/YYYY:HH:mm:ss Z"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }
  if [message] {
    json {
      source => "message"
      target => "parsed"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    hosts => [ "${ELASTICSEARCH_HOST:https://elasticsearch:9200}" ]
    user => "${ELASTIC_USER:elastic}"
    password => "${ELASTIC_PASSWORD:changeme}"
    ssl => true
    ssl_certificate_verification => false
    index => "ft-transcendence-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
  stdout {
    codec => rubydebug
  }
}
