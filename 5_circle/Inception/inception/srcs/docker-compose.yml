# version: "3.8"

services:
  mariadb:
    image: srcs-mariadb           # ← 직접 빌드했다면 build 로 바꾸세요
    # build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env                      # MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    networks: [inception]
    ports:
      - "3306:3306"               # 로컬 확인용(필요 없으면 제거)

  wordpress:
    image: srcs-wordpress
    # build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env                      # MYSQL_* 변수 사용
    depends_on:
      - mariadb                   # DB 먼저
    volumes:
      - wp_files:/var/www/wordpress   # ★ nginx와 동일한 볼륨·경로
    restart: always
    networks: [inception]
    # 외부 포트 바인딩 없음 (php-fpm:9000 내부통신)

  nginx:
    image: srcs-nginx
    # build: ./requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress                 # wp(fpm) 다음
    env_file:
      - .env                      # DOMAIN_NAME 등 사용 시
    volumes:
      - wp_files:/var/www/wordpress   # ★ wordpress와 동일
      - ./requirements/nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"                   # 개발 중 http 확인용(최종 제출 시 제거 또는 443으로 리다이렉트)
      - "443:443"                 # 과제 요구사항 핵심
    restart: always
    networks: [inception]

volumes:
  wp_files:                        # 워드프레스 파일 공유
  db_data:                         # DB 데이터 보존

networks:
  inception:
